name: Build Cenit APK

on:
    workflow_dispatch:
        inputs:
            build_type:
                description: 'Build type'
                required: true
                default: 'debug'
                type: choice
                options:
                    - debug
                    - release

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            MODULE: app

        steps:
            - uses: actions/checkout@v5

            - name: Set up JDK
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "21"

            - name: Make Gradle executable
              run: chmod +x ./gradlew

            - name: Decode Keystore
              if: github.event.inputs.build_type == 'release'
              run: |
                  echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/keystore.jks

            - name: Create keystore.properties
              if: github.event.inputs.build_type == 'release'
              run: |
                  echo "storeFile=${{ github.workspace }}/keystore.jks" > keystore.properties
                  echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
                  echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
                  echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

            - name: Empaquetar ANGLE si hay un pack publicado
              # Cenit 0.6.39: el interruptor «ANGLE (OpenGL sobre Vulkan)» necesita
              # libEGL_angle.so/libGLESv2_angle.so dentro del APK. Esas librerías
              # las produce build-angle.yml y las publica en un release
              # cenit-angle-*; acá se baja el pack más reciente, nada más. Si no
              # existe todavía, el APK sale igual y el interruptor avisa que no
              # hay librerías. Nunca debe tumbar el build.
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 60 --json tagName --jq '.[].tagName' | grep '^cenit-angle-' | head -1 || true)
                  if [ -z "${TAG:-}" ]; then echo "sin release de ANGLE todavía; el APK sale sin ANGLE"; exit 0; fi
                  ASSET=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep '^Cenit-ANGLE-' | head -1 || true)
                  if [ -z "${ASSET:-}" ]; then echo "release $TAG sin zip de ANGLE; el APK sale sin ANGLE"; exit 0; fi
                  mkdir -p app/src/main/jniLibs/arm64-v8a
                  rm -rf /tmp/angle && mkdir -p /tmp/angle
                  gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$ASSET" -D /tmp/angle
                  unzip -o "/tmp/angle/$ASSET" -d app/src/main/jniLibs/arm64-v8a
                  ls -la app/src/main/jniLibs/arm64-v8a

            - name: Build debug APK
              if: github.event.inputs.build_type == 'debug'
              run: ./gradlew assembleDebug

            - name: Build release APK
              if: github.event.inputs.build_type == 'release'
              run: ./gradlew assembleRelease

            # Cenit 0.6.13 (revisión de ingeniería, prioridad 4): no basta con
            # pedir CMAKE_BUILD_TYPE=Release; hay que VER la línea de compilación
            # real de los archivos calientes (¿-O2 o -O3?, ¿LTO?, ¿exceptions?) y el
            # tamaño del .so. Esto sale en el log del job y viaja a quien audite.
            # continue-on-error: es diagnóstico, nunca debe tumbar un release.
            - name: Volcar flags de compilación del core (diagnóstico)
              if: github.event.inputs.build_type == 'release'
              continue-on-error: true
              run: |
                  set +e
                  CCJ=$(find "$GITHUB_WORKSPACE/app" -name compile_commands.json 2>/dev/null | head -1)
                  echo "compile_commands.json: ${CCJ:-NO ENCONTRADO}"
                  if [ -n "$CCJ" ]; then
                    for FRAG in microVU-arm64 iR5900-arm64 MTVU PerformanceMetrics; do
                      echo "=== flags de $FRAG ==="
                      jq -r --arg f "$FRAG" \
                        '.[] | select(.file | contains($f)) | .command' "$CCJ" 2>/dev/null \
                        | head -1 | tr ' ' '\n' \
                        | grep -E '^(-O|-flto|-fno-rtti|-fno-exceptions|-fexceptions|-frtti|-march|-target)' \
                        | sort -u
                    done
                  else
                    echo "sin compile_commands.json: se buscan los flags en el log de CMake"
                    grep -R -h -E "CMAKE_CXX_FLAGS|BUILD_TYPE" "$GITHUB_WORKSPACE/app/build" 2>/dev/null | head -5
                  fi
                  echo "=== tamaños de librerías nativas en el APK ==="
                  APK=$(find "$GITHUB_WORKSPACE/app/build/outputs/apk/release" -name '*.apk' | head -1)
                  if [ -n "$APK" ]; then
                    unzip -l "$APK" | grep -E '\.so$' | awk '{print $1, $4}' | sort -rn | head -15
                  fi

            - name: Upload debug APK artifact
              if: github.event.inputs.build_type == 'debug'
              uses: actions/upload-artifact@v4
              with:
                  name: pcsx2-android-debug
                  path: ${{ env.MODULE }}/build/outputs/apk/debug/*.apk

            - name: Upload release APK artifact
              if: github.event.inputs.build_type == 'release'
              uses: actions/upload-artifact@v4
              with:
                  name: pcsx2-android-release
                  path: ${{ env.MODULE }}/build/outputs/apk/release/*.apk
