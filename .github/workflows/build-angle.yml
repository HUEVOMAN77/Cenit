name: Build ANGLE Vulkan Android libs

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Publicar el pack como Release (cenit-angle-*), que build.yml empaqueta en el APK"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-angle-android:
    name: Build ANGLE Vulkan (Android arm64)
    runs-on: ubuntu-latest
    env:
      ANGLE_DIR: ${{ github.workspace }}/angle
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0
      GCLIENT_PY3: 1

    steps:
      - uses: actions/checkout@v5

      - name: Free disk space on runner
        uses: rokibhasansagar/slimhub_actions@v25.42.5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 curl lsb-release build-essential

      - name: Fetch depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "${GITHUB_WORKSPACE}/depot_tools" >> $GITHUB_PATH

      - name: Configure gclient for ANGLE (main branch, Android)
        run: |
          rm -rf "${ANGLE_DIR}"
          mkdir -p "${ANGLE_DIR}"
          cd "${ANGLE_DIR}"
          gclient config --spec "solutions = [ { 'name': '.', 'url': 'https://chromium.googlesource.com/angle/angle.git', 'deps_file': 'DEPS', 'managed': True, 'custom_vars': {}, 'revision': 'refs/heads/main' }, ]; target_os = ['android']"

      - name: Sync ANGLE dependencies (Android)
        run: |
          cd "${ANGLE_DIR}"
          gclient sync --no-history --with_branch_heads --with_tags --revision refs/heads/main
          gclient runhooks

      - name: Install Linux build deps for Android
        run: |
          cd "${ANGLE_DIR}"
          ./build/install-build-deps.sh --no-prompt --android

      - name: Generate GN args (Vulkan release, arm64)
        run: |
          cd "${ANGLE_DIR}"
          gn gen out/Android --args='target_os="android" target_cpu="arm64" angle_enable_vulkan=true is_component_build=false is_official_build=false is_debug=false'

      - name: Build ANGLE Vulkan libraries
        run: |
          cd "${ANGLE_DIR}"
          autoninja -C out/Android libEGL libGLESv2

      - name: Empaquetar con los nombres que carga Cenit
        run: |
          cd "${ANGLE_DIR}/out/Android"
          # GN en Android ya suele producir libEGL_angle/libGLESv2_angle (el
          # sufijo existe justamente para poder empaquetarlas sin chocar con las
          # del sistema). Normalizamos por si la rama main cambia los nombres.
          EGL=$(ls libEGL*.so | grep -v unstripped | head -1)
          GLES=$(ls libGLESv2*.so | grep -v unstripped | head -1)
          echo "EGL=$EGL GLES=$GLES"
          rm -rf /tmp/angle && mkdir -p /tmp/angle
          cp "$EGL" /tmp/angle/libEGL_angle.so
          cp "$GLES" /tmp/angle/libGLESv2_angle.so
          (cd /tmp/angle && zip -9 "${GITHUB_WORKSPACE}/Cenit-ANGLE-$(date -u +%Y%m%d).zip" libEGL_angle.so libGLESv2_angle.so)
          ls -la "${GITHUB_WORKSPACE}"/Cenit-ANGLE-*.zip

      - name: Upload ANGLE Vulkan libs
        uses: actions/upload-artifact@v4
        with:
          name: angle-android-vulkan-arm64
          path: |
            ${{ env.ANGLE_DIR }}/out/Android/libEGL*.so
            ${{ env.ANGLE_DIR }}/out/Android/libGLESv2*.so
            ${{ env.ANGLE_DIR }}/out/Android/lib.unstripped/libEGL*.so
            ${{ env.ANGLE_DIR }}/out/Android/lib.unstripped/libGLESv2*.so
            Cenit-ANGLE-*.zip

      # El runner de este job pasa por slimhub, que borra la CLI `gh` de la
      # imagen: llamarla acá termina en «gh: command not found» y el pack se
      # compila, se sube como artifact... y nunca llega a Release (pasó el
      # 2026-10-23). Se publica por REST con curl, que sí queda disponible.
      - name: Publicar Release de ANGLE
        if: inputs.make_release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PACK=$(ls Cenit-ANGLE-*.zip)
          TAG="cenit-angle-$(date -u +%Y%m%d-%H%M)"
          cat > /tmp/rel.json <<JSON
          {
            "tag_name": "$TAG",
            "name": "Cenit ANGLE (Vulkan, arm64)",
            "body": "Librerias ANGLE compiladas por el CI de Cenit (chromium/angle main, backend Vulkan, arm64). libEGL_angle.so y libGLESv2_angle.so son las que build.yml mete en jniLibs antes de compilar, asi que el interruptor ANGLE de Ajustes funciona sin importar nada a mano.",
            "draft": false,
            "prerelease": false
          }
          JSON
          REL=$(curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases" \
            --data-binary @/tmp/rel.json)
          ID=$(printf '%s' "$REL" | grep -o '"id": *[0-9]*' | head -1 | tr -dc '0-9')
          if [ -z "$ID" ]; then echo "no se pudo crear la release: $REL"; exit 1; fi
          echo "release $TAG creada (id $ID)"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/zip" \
            -H "Accept: application/vnd.github+json" \
            "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=$PACK" \
            --data-binary @"$PACK" > /tmp/up.json
          grep -q '"state": *"uploaded"' /tmp/up.json || { echo "fallo la subida: $(head -c 400 /tmp/up.json)"; exit 1; }
          echo "pack $PACK publicado en $TAG"
