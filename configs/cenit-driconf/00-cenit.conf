<?xml version="1.0" encoding="UTF-8"?>
<driconf>
  <!--
    Cenit: reglas por juego para Turnip, horneadas dentro del driver.

    Android no trae expat, y Mesa lo tiene bloqueado a proposito (meson.build:
    "xmlconfig not available on Android or Windows"). Por eso en Android el driconf
    no se lee de un archivo en tiempo de ejecucion: se COMPILA. src/util/meson.build
    acumula los .conf de files_drirc, driconf_static.py los convierte en
    driconf_static.h, y ahi queda dentro de vulkan.cenit.so. El workflow
    build-turnip.yml copia este archivo a mesa/src/util/ y lo anade a files_drirc.

    Como engancha con Cenit: la app declara el SERIAL del juego como
    applicationName de la instancia Vulkan (GSDeviceVK.cpp), y Turnip pasa ese
    nombre a driParseConfigFiles (tu_device.cc). Ahi empareja por
    application_name_match, que es una expresion regular: por eso cada regla va
    anclada con ^...$.

    Opciones validas para driver="turnip" (nombres exactos, verificados en Mesa
    25.3.6: src/util/driconf.h y los driQueryOptionb de src/freedreno/vulkan/tu_device.cc):
      vk_dont_care_as_load                      trata LOAD_OP_DONT_CARE como LOAD
      disable_conservative_lrz                  desactiva el LRZ conservador
      tu_dont_reserve_descriptor_set            no reserva sets de descriptores
      tu_allow_oob_indirect_ubo_loads           permite lecturas UBO indirectas fuera de rango
      tu_disable_d24s8_border_color_workaround  workaround de border color en D24S8
      tu_use_tex_coord_round_nearest_even_mode  redondeo de coordenadas de textura (estilo D3D)
      tu_ignore_frag_depth_direction            ignora la direccion de gl_FragDepth

    Reglas vacias a proposito: cada regla tiene que nacer de una medicion en el
    telefono (HUD/A-B del guardarraya), no de una suposicion. Las reglas que el
    usuario crea desde Cenit (Ajustes → Controlador grafico personalizado → Reglas
    por juego) se exportan a drivers/00-cenit.conf y reemplazan este bloque al
    recompilar el driver.
  -->
  <device driver="turnip">
    <!-- sin reglas activas -->
  </device>
</driconf>
